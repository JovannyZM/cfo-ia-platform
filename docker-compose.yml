services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cfo_ia
      POSTGRES_USER: cfo_ia
      POSTGRES_PASSWORD: cfo_ia_local
    ports:
      - '5432:5432'
    volumes:
      - cfo_ia_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cfo_ia -d cfo_ia']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cfo_ia_postgres:
